<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trend Wear Admin</title><link rel="stylesheet" href="/styles.css"></head>
<body class="admin-body">
<div id="loginView" class="admin-login"><div class="admin-card"><img src="/assets/trend-wear-logo.jpg" alt="Trend Wear"><p class="eyebrow">Private administration</p><h1>Sign in</h1><form id="loginForm"><input name="email" type="email" required placeholder="Admin email"><input name="password" type="password" required placeholder="Password"><button class="primary full">Sign in</button></form><div id="loginMsg"></div></div></div>
<div id="adminView" hidden>
<header class="admin-header"><div><p class="eyebrow">Trend Wear</p><h1>Admin Panel</h1></div><div><a class="secondary-btn" href="/">View site</a> <button class="secondary-btn" id="logoutBtn">Logout</button></div></header>
<nav class="admin-tabs"><button data-tab="dashboard">Dashboard</button><button data-tab="products">Products</button><button data-tab="orders">Orders</button><button data-tab="landing">Landing</button><button data-tab="settings">Settings</button></nav>
<main class="admin-main">
<section data-panel="dashboard"><div id="stats" class="stats"></div><div class="panel"><h2>Recent orders</h2><div id="recentOrders"></div></div></section>
<section data-panel="products" hidden><div class="panel"><div class="panel-title"><h2>Products</h2><button class="primary" id="newProductBtn">Add product</button></div><div id="productAdminList"></div></div><div id="productEditor" class="panel" hidden><h2 id="editorTitle">Add product</h2><form id="productForm"><input type="hidden" name="id"><input name="name" required placeholder="Product name"><input name="slug" placeholder="Slug (optional)"><textarea name="description" placeholder="Description"></textarea><div class="two"><input name="price" type="number" min="0" step="0.01" required placeholder="Price"><input name="compare_price" type="number" min="0" step="0.01" placeholder="Compare price"></div><div class="two"><input name="stock" type="number" min="0" required placeholder="Stock"><select name="category_id" id="productCategory"></select></div><input name="image_url" placeholder="Product image URL"><label><input name="featured" type="checkbox"> Featured</label><label><input name="active" type="checkbox" checked> Active</label><div><button class="primary">Save</button> <button type="button" class="secondary-btn" id="cancelEditor">Cancel</button></div></form></div></section>
<section data-panel="orders" hidden><div class="panel"><h2>Orders</h2><div id="ordersAdminList"></div></div></section>
<section data-panel="landing" hidden><div class="panel"><h2>Landing page</h2><p>Edit the database-driven sections. Changes are live after save.</p><div id="landingEditor"></div></div></section>
<section data-panel="settings" hidden><div class="panel"><h2>Store settings</h2><form id="settingsForm"><div id="settingsFields"></div><button class="primary">Save settings</button></form></div></section>
</main></div><script src="/admin.js"></script></body></html>
